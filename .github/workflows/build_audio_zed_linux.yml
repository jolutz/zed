name: build_audio_zed_linux

on:
  workflow_dispatch:
  push:
    branches:
      - audio-file-viewer

concurrency:
  group: build-audio-zed-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CXXFLAGS: -fpermissive
  RUST_BACKTRACE: '1'

jobs:
  build_linux_x86_64:
    name: Build Linux x86_64 bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Check audio viewer
        run: cargo check -p audio_viewer

      - name: Build Linux bundle
        run: ./script/bundle-linux

      - name: Verify bundle outputs
        run: |
          test -s target/release/zed-linux-x86_64.tar.gz
          test -s target/zed-remote-server-linux-x86_64.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-zed-linux-x86_64
          path: |
            target/release/zed-linux-x86_64.tar.gz
            target/zed-remote-server-linux-x86_64.gz
          if-no-files-found: error

      - name: Publish latest custom build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="audio-zed-linux-latest"
          app_asset="target/release/zed-linux-x86_64.tar.gz"
          remote_server_asset="target/zed-remote-server-linux-x86_64.gz"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "Latest audio Zed Linux build" \
              --notes "Latest custom Kubuntu-focused Zed build from the audio-file-viewer branch." \
              --prerelease
          else
            gh release edit "$release_tag" --target "$GITHUB_SHA"
          fi

          gh release upload "$release_tag" \
            "$app_asset" \
            "$remote_server_asset" \
            --clobber

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="audio-zed-linux-latest"
          actual_target="$(gh release view "$release_tag" --json targetCommitish --jq '.targetCommitish')"
          test "$actual_target" = "$GITHUB_SHA"

          for asset in \
            target/release/zed-linux-x86_64.tar.gz \
            target/zed-remote-server-linux-x86_64.gz
          do
            asset_name="$(basename "$asset")"
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            release_digest="$(gh release view "$release_tag" --json assets --jq ".assets[] | select(.name == \"$asset_name\") | .digest")"
            test -n "$release_digest"
            test "$release_digest" = "$local_digest"
          done
